<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050708">
<title>Land 3D · BuckTracks</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
html,body{margin:0;height:100%;background:#050708;color:#f6f1e8;font-family:system-ui,sans-serif}
#map{position:absolute;inset:0}
.bar{position:absolute;z-index:2;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top{top:12px}.bot{bottom:12px}
.glass{background:rgba(10,16,14,.88);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:14px;padding:10px 12px;font-size:12px}
button,.btn{appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#f6f1e8;border-radius:10px;padding:8px 12px;font-weight:600;font-size:12px;cursor:pointer}
button.primary{background:linear-gradient(135deg,#f0c14b,#e8a317);color:#1a1200;border:none}
a{color:#f5d078;text-decoration:none;font-size:12px;margin-right:8px}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar top">
  <div class="glass">
    <a href="index.html">BuckTracks</a>
    <strong id="status">Standing view · 200 m</strong>
  </div>
</div>
<div class="bar bot">
  <div class="glass" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <button class="primary" id="gps">Precision GPS</button>
    <button id="north">Face north</button>
    <button id="spin">Look 90°</button>
    <span id="meta" style="opacity:.7"></span>
  </div>
</div>
<script>
const NS={lat:45.3647,lon:-63.2797};
const ZOOM=16.85,PITCH=78,R=200;
function circle(lon,lat,m,steps=64){
  const coords=[];const mLat=111132.92-559.82*Math.cos(2*lat*Math.PI/180);const mLng=111412.84*Math.cos(lat*Math.PI/180);
  for(let i=0;i<=steps;i++){const a=i/steps*Math.PI*2;coords.push([lon+(m*Math.sin(a))/mLng,lat+(m*Math.cos(a))/mLat]);}
  return{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[coords]}};
}
function setRing(map,id,lon,lat,m,color,op){
  const data={type:'FeatureCollection',features:[circle(lon,lat,m)]};
  if(map.getSource(id))map.getSource(id).setData(data);
  else{
    map.addSource(id,{type:'geojson',data});
    map.addLayer({id:id+'-f',type:'fill',source:id,paint:{'fill-color':color,'fill-opacity':op}});
    map.addLayer({id:id+'-l',type:'line',source:id,paint:{'line-color':color,'line-width':2,'line-dasharray':[2,1.5]}});
  }
}
const map=new maplibregl.Map({
  container:'map',
  style:{
    version:8,
    sources:{
      sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'© Esri'},
      dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:15}
    },
    layers:[
      {id:'sat',type:'raster',source:'sat'},
      {id:'hs',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':0.45}}
    ],
    terrain:{source:'dem',exaggeration:1.2},
    sky:{'sky-color':'#7eb0d0','horizon-color':'#d0dde8','fog-color':'#b8c6d0'}
  },
  center:[NS.lon,NS.lat],zoom:ZOOM,pitch:PITCH,bearing:0,maxPitch:85,antialias:true
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
const marker=new maplibregl.Marker({color:'#e8a317'}).setLngLat([NS.lon,NS.lat]).addTo(map);
map.on('load',()=>{setRing(map,'r200',NS.lon,NS.lat,R,'#e8a317',0.07);document.getElementById('meta').textContent=NS.lat.toFixed(5)+', '+NS.lon.toFixed(5)});
function stand(lat,lon,acc){
  map.flyTo({center:[lon,lat],zoom:ZOOM,pitch:PITCH,bearing:0,duration:1400});
  marker.setLngLat([lon,lat]);
  setRing(map,'r200',lon,lat,R,'#e8a317',0.07);
  if(acc>0)setRing(map,'acc',lon,lat,acc,'#38bdf8',0.12);
  document.getElementById('meta').textContent=lat.toFixed(7)+', '+lon.toFixed(7)+(acc?(' · ±'+acc.toFixed(1)+' m'):'');
  document.getElementById('status').textContent='Standing · 200 m · true north';
}
document.getElementById('gps').onclick=()=>{
  document.getElementById('status').textContent='High-accuracy fix…';
  navigator.geolocation.getCurrentPosition(
    p=>stand(p.coords.latitude,p.coords.longitude,p.coords.accuracy),
    ()=>{document.getElementById('status').textContent='GPS failed — enable location'},
    {enableHighAccuracy:true,timeout:25000,maximumAge:0}
  );
};
document.getElementById('north').onclick=()=>map.easeTo({bearing:0,duration:800});
document.getElementById('spin').onclick=()=>map.easeTo({bearing:map.getBearing()+90,duration:2000});
</script>
</body>
</html>
