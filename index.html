<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeerBook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body>

    <!-- ================= AUTHENTICATION SCREEN ================= -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            <div class="space-y-4 text-center md:text-left flex flex-col items-center md:items-start">
                <div class="w-28 h-28 rounded-3xl shadow-xl overflow-hidden bg-blue-600 flex items-center justify-center border-4 border-white">
                    <img src="image_3.png" alt="DeerBook Logo" class="w-full h-full object-cover">
                </div>
                <h1 class="text-4xl font-bold text-blue-600 tracking-tight">DeerBook</h1>
                <p class="text-lg text-gray-600">Connect with your hunting party, share status updates, like, comment, and chat live.</p>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-200 w-full max-w-md space-y-4">
                <div class="space-y-3">
                    <input id="login-username" type="text" placeholder="Your Name or Username" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md text-base">Log In / Join</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= MAIN APP INTERFACE ================= -->
    <div id="main-app" class="hidden flex-col min-h-screen">
        
        <!-- Facebook-Style Navbar -->
        <header class="bg-white border-b border-gray-300 px-4 h-14 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl overflow-hidden shadow bg-blue-600 flex items-center justify-center">
                    <img src="image_3.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <span class="text-xl font-bold text-blue-600 tracking-tight">DeerBook</span>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-sm font-semibold text-gray-700" id="current-username-display"></span>
                <button onclick="handleLogout()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-md font-semibold text-gray-700 transition">Log Out</button>
            </div>
        </header>

        <!-- Main Workspace Layout -->
        <div class="flex-1 max-w-6xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 p-4 gap-6">
            
            <!-- Center Feed Column (Facebook News Feed) -->
            <div class="md:col-span-2 space-y-4">
                <!-- Status Creation Box -->
                <div class="bg-white p-4 rounded-xl shadow border border-gray-200 space-y-3">
                    <div class="flex space-x-3 items-center">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 font-bold flex items-center justify-center text-sm" id="user-avatar-initials"></div>
                        <textarea id="status-input" rows="2" placeholder="What's happening in the woods today?" class="flex-1 bg-gray-100 p-3 rounded-2xl text-sm outline-none resize-none focus:bg-white focus:ring-1 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="flex justify-end pt-1 border-t border-gray-100">
                        <button onclick="postStatus()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-semibold transition shadow-sm">Post</button>
                    </div>
                </div>

                <!-- News Feed Stream -->
                <div id="status-stream" class="space-y-4">
                    <!-- Dynamic posts injected here -->
                </div>
            </div>

            <!-- Right Column (Live Campfire Chat) -->
            <div class="bg-white rounded-xl shadow border border-gray-200 flex flex-col h-[550px] sticky top-20">
                <div class="p-3 border-b border-gray-200 bg-gray-50 rounded-t-xl flex justify-between items-center">
                    <h3 class="font-bold text-sm text-gray-800">Campfire Chat</h3>
                    <span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span>
                </div>
                
                <!-- Chat Messages Stream -->
                <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-2 text-sm flex flex-col">
                    <div class="bg-gray-100 p-2 rounded-lg max-w-[85%] self-start">
                        <span class="font-bold text-xs text-blue-600 block">System</span>
                        Welcome to the camp chat. Say hello to your party!
                    </div>
                </div>

                <!-- Chat Input Bar -->
                <div class="p-3 border-t border-gray-200 flex space-x-2 bg-white rounded-b-xl">
                    <input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 bg-gray-100 px-3 py-2 rounded-lg text-sm outline-none focus:ring-1 focus:ring-blue-500" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                    <button onclick="sendChatMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Send</button>
                </div>
            </div>

        </div>
    </div>

    <!-- ================= FULL FUNCTIONALITY SCRIPT ================= -->
    <script>
        let loggedInUser = "";

        function handleLogin() {
            const usernameInput = document.getElementById('login-username').value.trim();
            if (!usernameInput) {
                alert("Please enter a username.");
                return;
            }
            loggedInUser = usernameInput;
            document.getElementById('current-username-display').innerText = loggedInUser;
            document.getElementById('user-avatar-initials').innerText = loggedInUser.substring(0, 2).toUpperCase();
            
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('main-app').classList.add('flex');
        }

        function handleLogout() {
            loggedInUser = "";
            document.getElementById('login-username').value = "";
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('main-app').classList.remove('flex');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        function postStatus() {
            const input = document.getElementById('status-input');
            const text = input.value.trim();
            if (!text) return;

            const stream = document.getElementById('status-stream');
            const initials = loggedInUser.substring(0, 2).toUpperCase();
            
            const postHTML = `
                <div class="bg-white p-4 rounded-xl shadow border border-gray-200 space-y-3 post-card">
                    <!-- Post Header -->
                    <div class="flex items-center space-x-2">
                        <div class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs">
                            ${initials}
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-gray-900">${escapeHtml(loggedInUser)}</h4>
                            <span class="text-xs text-gray-400">Just now</span>
                        </div>
                    </div>
                    <!-- Post Content -->
                    <p class="text-sm text-gray-800">${escapeHtml(text)}</p>
                    
                    <!-- Facebook Engagement Bar -->
                    <div class="flex justify-between text-xs text-gray-500 pt-2 border-t border-gray-100">
                        <button onclick="likePost(this)" class="hover:text-blue-600 font-semibold py-1 flex-1 text-center transition">👍 Like (<span class="like-count">0</span>)</button>
                        <button onclick="toggleComments(this)" class="hover:text-blue-600 font-semibold py-1 flex-1 text-center transition">💬 Comment (<span class="comment-count">0</span>)</button>
                        <button onclick="alert('Post shared successfully!')" class="hover:text-blue-600 font-semibold py-1 flex-1 text-center transition">↗️ Share</button>
                    </div>

                    <!-- Comment Section (Initially Hidden) -->
                    <div class="comment-section space-y-2 pt-2 border-t border-gray-100 hidden">
                        <div class="comment-list space-y-1.5 text-xs"></div>
                        <div class="flex space-x-2 pt-1">
                            <input type="text" placeholder="Write a comment..." class="comment-input flex-1 bg-gray-100 px-3 py-1.5 rounded-lg text-xs outline-none border border-gray-200 focus:bg-white focus:ring-1 focus:ring-blue-500" onkeypress="if(event.key === 'Enter') submitComment(this)">
                            <button onclick="submitCommentFromButton(this)" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-700">Reply</button>
                        </div>
                    </div>
                </div>
            `;
            stream.insertAdjacentHTML('afterbegin', postHTML);
            input.value = "";
        }

        function likePost(btn) {
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.innerText);
            countSpan.innerText = count + 1;
            btn.classList.add('text-blue-600', 'font-bold');
        }

        function toggleComments(btn) {
            const card = btn.closest('.post-card');
            const commentSection = card.querySelector('.comment-section');
            commentSection.classList.toggle('hidden');
        }

        function submitComment(inputElement) {
            const val = inputElement.value.trim();
            if (!val) return;

            const card = inputElement.closest('.post-card');
            const list = card.querySelector('.comment-list');
            
            const commentHTML = `
                <div class="bg-gray-50 p-2 rounded-lg flex space-x-2 items-start">
                    <span class="font-bold text-gray-900">${escapeHtml(loggedInUser)}:</span>
                    <span class="text-gray-800 flex-1">${escapeHtml(val)}</span>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', commentHTML);

            const countSpan = card.querySelector('.comment-count');
            countSpan.innerText = parseInt(countSpan.innerText) + 1;
            inputElement.value = "";
        }

        function submitCommentFromButton(btn) {
            const input = btn.previousElementSibling;
            submitComment(input);
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const chatContainer = document.getElementById('chat-messages');
            const messageHTML = `
                <div class="bg-blue-50 border border-blue-100 p-2 rounded-lg max-w-[85%] self-end">
                    <span class="font-bold text-xs text-blue-800 block">${escapeHtml(loggedInUser)}</span>
                    <span class="text-gray-800">${escapeHtml(text)}</span>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', messageHTML);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            input.value = "";
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
