<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUCKTRACK PRO · CANADA</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-dark: #12181b;
      --panel-bg: #1b2226;
      --accent-green: #2e7d32;
      --accent-gold: #c0ca33;
      --text-main: #eceff1;
      --text-muted: #90a4ae;
      --border-color: #263238;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    #app-container { display: flex; width: 100vw; height: 100vh; position: relative; }
    #map { flex: 1; height: 100%; z-index: 1; }

    /* Side Panel */
    #side-panel { width: 380px; background-color: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 2; transition: transform 0.3s ease; }
    .panel-header { padding: 16px; background-color: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-color); }
    .panel-header h1 { font-size: 1.2rem; color: var(--accent-gold); letter-spacing: 1px; }

    /* Tabs & Content */
    .tab-bar { display: flex; background-color: rgba(0,0,0,0.3); }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: bold; }
    .tab-btn.active { color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold); }
    
    .panel-content { flex: 1; display: none; flex-direction: column; padding: 16px; overflow-y: auto; }
    .panel-content.active { display: flex; }

    /* Controls & Utilities */
    .control-group { margin-bottom: 20px; }
    .control-group h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
    .btn { background: var(--accent-green); color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 8px; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #37474f; }
    
    /* Chat System */
    #chat-log { flex: 1; min-height: 200px; max-height: 350px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 4px; margin-bottom: 10px; border: 1px solid var(--border-color); }
    .msg { margin-bottom: 8px; font-size: 0.85rem; line-height: 1.3; }
    .msg.system { color: var(--accent-gold); }
    .msg.user { color: #81d4fa; text-align: right; }
    .msg-label { font-size: 0.65rem; opacity: 0.7; margin-bottom: 2px; }
    
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 4px; }
    .chat-input-row button { width: auto; padding: 8px 16px; }

    /* Map Elements */
    .popup-title { font-weight: bold; color: #111; }
    .popup-sub { font-size: 0.8rem; color: #555; }
    .popup-tag { display: inline-block; background: #333; color: #fff; font-size: 0.65rem; padding: 2px 4px; border-radius: 2px; margin-top: 4px; }

    /* Mobile Layout Fixes */
    @media (max-width: 768px) {
      #side-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 100%; transform: translateX(100%); }
      #side-panel.mobile-open { transform: translateX(0); }
      .mobile-dock { position: absolute; bottom: 10px; left: 10px; z-index: 1000; display: flex; gap: 8px; }
      .mobile-dock button { padding: 10px; background: var(--panel-bg); border: 1px solid var(--border-color); color: white; border-radius: 50%; width: 44px; height: 44px; }
    }
  </style>

  <!-- Leaflet JS & SunCalc -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
</head>
<body>

<div id="app-container">
  <div id="map"></div>

  <div id="side-panel">
    <div class="panel-header">
      <h1>BUCKTRACK PRO</h1>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="chat-tab" onclick="switchPanel('chat')">Guide & Log</button>
      <button class="tab-btn" id="cam-tab" onclick="switchPanel('cam')">Tools & Cams</button>
    </div>

    <!-- Chat Panel -->
    <div class="panel-content active" id="chat-panel">
      <div id="chat-log"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Ask AI guide or add log..." />
        <button class="btn" onclick="sendQuery()">Send</button>
      </div>
    </div>

    <!-- Cams & Tools Panel -->
    <div class="panel-content" id="cam-panel">
      <div class="control-group">
        <h3>Waypoint Controls</h3>
        <button class="btn" onclick="dropTyped('stand')">Drop Tree Stand Pin</button>
        <button class="btn" onclick="dropTyped('scrape')">Drop Scrape Pin</button>
        <button class="btn" onclick="dropTyped('bed')">Drop Bedding Area</button>
        <button class="btn btn-secondary" onclick="pinCameraAtMapCenter()">Pin Cam at Center</button>
        <button class="btn btn-secondary" onclick="clearWaypoints()">Clear Marks</button>
        <button class="btn btn-secondary" onclick="exportGPX()">Export GPX</button>
      </div>

      <div class="control-group">
        <h3>Camera Status</h3>
        <p id="cam-location-status" style="font-size: 0.8rem; color: var(--text-muted);">No camera selected.</p>
      </div>

      <div class="control-group">
        <h3>Checklist</h3>
        <label><input type="checkbox" id="chk-wind"> Check Wind Direction</label><br>
        <label><input type="checkbox" id="chk-scent"> Apply Scent Elimination</label><br>
        <label><input type="checkbox" id="chk-land"> Verify Land Access</label><br>
        <label><input type="checkbox" id="chk-licence"> Tags/Licence Ready</label><br>
        <label><input type="checkbox" id="chk-exit"> Planned Exit Route</label>
      </div>

      <div class="control-group">
        <h3>Settings</h3>
        <label><input type="checkbox" id="mag-scent"> Magnetic Scent Cone Correction</label><br>
        <label><input type="checkbox" id="labels-toggle"> Toggle Map Labels</label><br>
        <label><input type="checkbox" id="hillshade-toggle"> Toggle Hillshade</label>
      </div>
    </div>
  </div>
</div>

<script>
  // Global App State
  const $ = (id) => document.getElementById(id);
  let map, scentConePoly;
  let waypoints = [];
  let activeCameraLoc = null;
  let currentPhotoGps = null;
  
  let currentLat = 45.8167; // Default Fallback (Springhill NS area)
  let currentLng = -64.0500;
  let currentWindSpeed = 12;
  let currentWindDeg = 225; // SW
  let currentDecl = -17.5; // Default Mag Declination
  let currentLang = "en";

  /* ---------- MAP INITIALIZATION ---------- */
  function initMap() {
    map = L.map('map').setView([currentLat, currentLng], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    updateScentCone();
  }

  function createMarkerIcon(color, letter) {
    return L.divIcon({
      className: 'custom-icon',
      html: `<div style="background-color:${color}; width:24px; height:24px; border-radius:50%; border:2px solid white; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:12px;">${letter}</div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });
  }

  function dropTyped(kind) {
    const center = map.getCenter();
    const configs = {
      stand: { color: "purple", letter: "T", tag: "STAND", sub: "Tree stand / blind" },
      scrape: { color: "yellow", letter: "S", tag: "SCRAPE", sub: "Buck sign" },
      bed: { color: "red", letter: "B", tag: "BED", sub: "Cover / bed pin" },
      cam: { color: "blue", letter: "C", tag: "CAMERA", sub: "Trail camera location" },
      wp: { color: "green", letter: "W", tag: "WAYPOINT", sub: "Field mark" }
    };
    const cfg = configs[kind] || configs.wp;
    
    const name = `${cfg.tag} ${waypoints.length + 1}`;
    const m = L.marker([center.lat, center.lng], { icon: createMarkerIcon(cfg.color, cfg.letter) })
      .bindPopup(
        `<div class='popup-title'>${name}</div>` +
        `<div class='popup-sub'>${cfg.sub}</div>` +
        `<div class='popup-sub'>${center.lat.toFixed(6)}, ${center.lng.toFixed(6)}</div>` +
        `<span class='popup-tag'>${cfg.tag}</span>`
      )
      .addTo(map);

    waypoints.push({ marker: m, lat: center.lat, lng: center.lng, name, kind, t: Date.now() });
    persistWaypoints();
    addMessage(`Dropped ${cfg.tag} mark at center.`, false);
  }

  function windDirection(deg) {
    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    return dirs[Math.round(deg / 45) % 8];
  }

  function updateScentCone() {
    if (scentConePoly) map.removeLayer(scentConePoly);

    const useMag = $("mag-scent")?.checked;
    let heading = (currentWindDeg + 180) % 360; 
    if (useMag) heading = (heading + currentDecl + 360) % 360;

    const spread = 30; // 30 deg cone angle
    const distance = 0.005; // Radial approx

    const radCenter = (heading * Math.PI) / 180;
    const radLeft = ((heading - spread / 2) * Math.PI) / 180;
    const radRight = ((heading + spread / 2) * Math.PI) / 180;

    const p1 = [currentLat, currentLng];
    const p2 = [currentLat + distance * Math.cos(radLeft), currentLng + distance * Math.sin(radLeft)];
    const p3 = [currentLat + distance * 1.5 * Math.cos(radCenter), currentLng + distance * 1.5 * Math.sin(radCenter)];
    const p4 = [currentLat + distance * Math.cos(radRight), currentLng + distance * Math.sin(radRight)];

    scentConePoly = L.polygon([p1, p2, p3, p4], {
      color: 'red',
      fillColor: '#f03',
      fillOpacity: 0.25,
      weight: 1
    }).addTo(map);
  }

  function setActiveCamera(lat, lng, name, source) {
    activeCameraLoc = { lat, lng, name, source };
    try {
      localStorage.setItem("bt_active_camera", JSON.stringify(activeCameraLoc));
    } catch (e) {}

    const statusEl = $("cam-location-status");
    if (statusEl) {
      statusEl.textContent = `Active camera set: ${name} (${lat.toFixed(5)}, ${lng.toFixed(5)})`;
    }
  }

  function pinCameraFromPhoto() {
    if (!currentPhotoGps) {
      alert("No EXIF GPS metadata found in this photo.");
      return;
    }
    const { lat, lng } = currentPhotoGps;
    const name = "Cam Photo " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    
    const m = L.marker([lat, lng], { icon: createMarkerIcon("blue", "C") })
      .bindPopup(
        `<div class='popup-title'>${name}</div>` +
        `<div class='popup-sub'>Pinned from photo EXIF</div>` +
        `<div class='popup-sub'>${lat.toFixed(6)}, ${lng.toFixed(6)}</div>` +
        `<span class='popup-tag'>CAMERA</span>`
      )
      .addTo(map);

    waypoints.push({ marker: m, lat, lng, name, kind: "cam", t: Date.now() });
    setActiveCamera(lat, lng, name, "exif");
    persistWaypoints();
    map.setView([lat, lng], 16);
    addMessage(`Pinned camera from EXIF metadata at ${lat.toFixed(5)}, ${lng.toFixed(5)}.`, false);
  }

  function pinCameraAtMapCenter() {
    dropTyped("cam");
  }

  function clearWaypoints() {
    waypoints.forEach(w => {
      if (w.marker) map.removeLayer(w.marker);
    });
    waypoints = [];
    persistWaypoints();
    addMessage("Cleared all custom map marks.", false);
  }

  function persistWaypoints() {
    const data = waypoints.map(w => ({ lat: w.lat, lng: w.lng, name: w.name, kind: w.kind, t: w.t }));
    try {
      localStorage.setItem("bt_waypoints", JSON.stringify(data));
    } catch (e) {}
  }

  function restoreWaypoints() {
    try {
      const raw = localStorage.getItem("bt_waypoints");
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) return;
      
      data.forEach(w => {
        const configs = {
          stand: { color: "purple", letter: "T", tag: "STAND", sub: "Tree stand / blind" },
          scrape: { color: "yellow", letter: "S", tag: "SCRAPE", sub: "Buck sign" },
          bed: { color: "red", letter: "B", tag: "BED", sub: "Cover / bed pin" },
          cam: { color: "blue", letter: "C", tag: "CAMERA", sub: "Trail camera location" },
          wp: { color: "green", letter: "W", tag: "WAYPOINT", sub: "Field mark" }
        };
        const cfg = configs[w.kind] || configs.wp;
        const m = L.marker([w.lat, w.lng], { icon: createMarkerIcon(cfg.color, cfg.letter) })
          .bindPopup(
            `<div class='popup-title'>${w.name}</div>` +
            `<div class='popup-sub'>${cfg.sub}</div>` +
            `<div class='popup-sub'>${w.lat.toFixed(6)}, ${w.lng.toFixed(6)}</div>` +
            `<span class='popup-tag'>${cfg.tag}</span>`
          )
          .addTo(map);
        waypoints.push({ marker: m, lat: w.lat, lng: w.lng, name: w.name, kind: w.kind, t: w.t });
      });
    } catch (e) {}
  }

  /* ---------- EXPORT & UTILITIES ---------- */

  function exportGPX() {
    if (waypoints.length === 0) {
      alert("No marks to export. Drop a stand, camera, or waypoint first.");
      return;
    }

    let gpx = `<?xml version="1.1" encoding="UTF-8"?>\n<gpx version="1.1" creator="BUCKTRACK PRO CANADA">\n`;
    waypoints.forEach(w => {
      gpx += `  <wpt lat="${w.lat}" lon="${w.lng}">\n    <name>${w.name}</name>\n    <sym>Waypoint</sym>\n  </wpt>\n`;
    });
    gpx += `</gpx>`;

    const blob = new Blob([gpx], { type: "application/gpx+xml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `bucktrack_waypoints_${Date.now()}.gpx`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function saveChecklist() {
    const checklist = {
      wind: $("chk-wind")?.checked || false,
      scent: $("chk-scent")?.checked || false,
      land: $("chk-land")?.checked || false,
      licence: $("chk-licence")?.checked || false,
      exit: $("chk-exit")?.checked || false
    };
    localStorage.setItem("bt_checklist", JSON.stringify(checklist));
  }

  function restoreChecklist() {
    try {
      const raw = localStorage.getItem("bt_checklist");
      if (!raw) return;
      const c = JSON.parse(raw);
      if ($("chk-wind")) $("chk-wind").checked = !!c.wind;
      if ($("chk-scent")) $("chk-scent").checked = !!c.scent;
      if ($("chk-land")) $("chk-land").checked = !!c.land;
      if ($("chk-licence")) $("chk-licence").checked = !!c.licence;
      if ($("chk-exit")) $("chk-exit").checked = !!c.exit;
    } catch (e) {}
  }

  function saveAllSettings() {
    const settings = {
      lang: currentLang,
      magScent: $("mag-scent")?.checked || false,
      labels: $("labels-toggle")?.checked || false,
      hillshade: $("hillshade-toggle")?.checked || false
    };
    localStorage.setItem("bt_settings", JSON.stringify(settings));
  }

  function switchPanel(tab) {
    $("chat-tab")?.classList.toggle("active", tab === "chat");
    $("cam-tab")?.classList.toggle("active", tab === "cam");
    $("chat-panel")?.classList.toggle("active", tab === "chat");
    $("cam-panel")?.classList.toggle("active", tab === "cam");
  }

  function mobileView(view) {
    const panel = $("side-panel");
    if (!panel) return;
    $("dock-map")?.classList.toggle("active", view === "map");
    $("dock-desk")?.classList.toggle("active", view === "desk");
    $("dock-photo")?.classList.toggle("active", view === "photo");

    if (view === "map") {
      panel.classList.remove("mobile-open");
    } else {
      panel.classList.add("mobile-open");
      switchPanel(view === "desk" ? "chat" : "cam");
    }
  }

  function closeMobilePanel() {
    mobileView("map");
  }

  function dismissTips() {
    $("tips-toast")?.classList.remove("show");
    localStorage.setItem("bt_tips_dismissed", "true");
  }

  function maybeShowTips() {
    if (!localStorage.getItem("bt_tips_dismissed")) {
      $("tips-toast")?.classList.add("show");
    }
  }

  function addMessage(text, isUser = false) {
    const log = $("chat-log");
    if (!log) return;
    
    const msg = document.createElement("div");
    msg.className = `msg ${isUser ? "user" : "system"}`;
    
    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = isUser ? "YOU" : "BUCKTRACK AI GUIDE";
    
    msg.appendChild(label);
    msg.appendChild(document.createTextNode(text));
    log.appendChild(msg);
    log.scrollTop = log.scrollHeight;
  }

  function sendQuery() {
    const input = $("chat-input");
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, true);
    input.value = "";

    setTimeout(() => {
      const wind = Math.round(currentWindSpeed || 0);
      const dir = windDirection(currentWindDeg || 0);
      const decl = Math.abs(currentDecl || 0).toFixed(1) + "°" + (currentDecl >= 0 ? "E" : "W");
      
      addMessage(`Field update for location (${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}):\nWind is currently blowing at ${wind} km/h from the ${dir}. Magnetic declination is ${decl}.\n\nWhen setting up, approach from downwind/crosswind relative to bedding cover. Keep your scent cone pointing away from travel corridors.`);
    }, 600);
  }

  /* ---------- INITIALIZATION ---------- */

  document.addEventListener("DOMContentLoaded", () => {
    initMap();

    // Bind Chat Input Enter Key
    $("chat-input")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendQuery();
    });

    // Bind Checklist Checkbox Listeners
    ["chk-wind", "chk-scent", "chk-land", "chk-licence", "chk-exit"].forEach(id => {
      $(id)?.addEventListener("change", saveChecklist);
    });

    // Bind Toggle Settings Listeners
    ["mag-scent", "labels-toggle", "hillshade-toggle"].forEach(id => {
      $(id)?.addEventListener("change", () => {
        saveAllSettings();
        if (typeof updateScentCone === "function") updateScentCone();
      });
    });

    // Restore Persisted Data
    restoreWaypoints();
    restoreChecklist();
    maybeShowTips();
    
    addMessage("System ready. Interactive GIS map & field guide initialized.");
  });
</script>
</body>
</html>
