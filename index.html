<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Tracking Hub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent: #238636;
            --accent-glow: rgba(35, 134, 54, 0.4);
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --btn-blue: #1f6feb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 8px; width: 100vw; overflow-x: hidden; }

        .app-container { display: flex; flex-direction: column; gap: 10px; max-width: 480px; margin: 0 auto; }

        header { background: var(--panel-bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
        header h1 { font-size: 1.1rem; color: #fff; letter-spacing: 0.5px; }

        .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
        .panel h2 { font-size: 0.95rem; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }

        .hud-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .hud-card { background: #090d12; border: 1px solid var(--border); padding: 8px; border-radius: 6px; text-align: center; }
        .hud-card .val { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .hud-card .label { font-size: 0.75rem; color: var(--text-muted); }

        .feed-list, .chat-box { max-height: 130px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
        .feed-item { background: #21262d; padding: 6px 8px; border-radius: 4px; border-left: 3px solid var(--accent); word-break: break-all; }
        .chat-item { border-left-color: #58a6ff; }

        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .chat-input-area { display: flex; gap: 6px; margin-top: 8px; }

        input, button { background: #21262d; border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        input { flex: 1; }
        button { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; text-align: center; }
        button.secondary { background: var(--btn-blue); }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>TACTICAL &amp; TELEMETRY HUB</h1>
        </header>

        <!-- Live Overlay HUD -->
        <div class="panel">
            <h2>
                <span>Telemetry Overlay</span>
                <span id="db-status" style="font-size: 0.7rem; color: var(--accent);">DB: Active</span>
            </h2>
            <div class="hud-grid">
                <div class="hud-card">
                    <div class="val" id="hud-events">0</div>
                    <div class="label">Logged Events</div>
                </div>
                <div class="hud-card">
                    <div class="val" id="hud-matches">0</div>
                    <div class="label">Match Stats</div>
                </div>
            </div>
            <div class="feed-list" id="feed-container">
                <div class="feed-item">Database initialized. Ready for streams...</div>
            </div>
            <div class="action-row">
                <button onclick="simulateTelemetry()">Simulate Telemetry</button>
                <button class="secondary" onclick="simulateMatchStat()">Simulate Match</button>
            </div>
        </div>

        <!-- Operations Chat Channel -->
        <div class="panel">
            <h2>Operations Channel</h2>
            <div class="chat-box" id="chat-container">
                <div class="feed-item chat-item">System secure and online.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Type message or status..." onkeydown="if(event.key==='Enter')sendChatMessage()">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Use BroadcastChannel to allow multi-tab real-time sync (simulating WebSockets)
        const channel = new BroadcastChannel('tactical_hub_channel');
        
        // Local Database Simulation using LocalStorage
        let db = {
            telemetry: JSON.parse(localStorage.getItem('db_telemetry') || '[]'),
            match_stats: JSON.parse(localStorage.getItem('db_stats') || '[]'),
            chat: JSON.parse(localStorage.getItem('db_chat') || '[]')
        };

        function saveDB() {
            localStorage.setItem('db_telemetry', JSON.stringify(db.telemetry));
            localStorage.setItem('db_stats', JSON.stringify(db.match_stats));
            localStorage.setItem('db_chat', JSON.stringify(db.chat));
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('hud-events').innerText = db.telemetry.length;
            document.getElementById('hud-matches').innerText = db.match_stats.length;
        }

        // Load historical entries on startup
        window.onload = function() {
            updateHUD();
            // Load last feeds
            db.telemetry.slice(-10).reverse().forEach(item => {
                appendFeed(`[${item.device_id}] ${item.event_type} (Conf: ${item.confidence}%)`);
            });
            db.match_stats.slice(-5).reverse().forEach(stat => {
                appendFeed(`[MATCH] ${stat.player_tag}: ${stat.kills}K/${stat.deaths}D (${stat.mode})`);
            });
            db.chat.slice(-10).forEach(msg => {
                appendChat(msg.sender, msg.text, false);
            });
        };

        // Action Handlers & Simulators
        function simulateTelemetry() {
            const devices = ['CAM_NORTH', 'CAM_SOUTH', 'GATE_SENSOR'];
            const events = ['Motion Detected', 'Wildlife Tagged', 'Secure Ping'];
            const entry = {
                device_id: devices[Math.floor(Math.random() * devices.length)],
                event_type: events[Math.floor(Math.random() * events.length)],
                confidence: (Math.random() * 20 + 80).toFixed(1),
                timestamp: new Date().toLocaleTimeString()
            };
            
            db.telemetry.push(entry);
            saveDB();

            const text = `[${entry.device_id}] ${entry.event_type} (Conf: ${entry.confidence}%)`;
            appendFeed(text);
            channel.postMessage({ type: 'telemetry', text: text });
        }

        function simulateMatchStat() {
            const modes = ['Ranked TDM', 'Hardpoint', 'Search & Destroy'];
            const stat = {
                player_tag: 'Operator_1',
                mode: modes[Math.floor(Math.random() * modes.length)],
                kills: Math.floor(Math.random() * 15 + 5),
                deaths: Math.floor(Math.random() * 10),
                timestamp: new Date().toLocaleTimeString()
            };

            db.match_stats.push(stat);
            saveDB();

            const text = `[MATCH] ${stat.player_tag}: ${stat.kills}K/${stat.deaths}D (${stat.mode})`;
            appendFeed(text);
            channel.postMessage({ type: 'match', text: text });
        }

        function sendChatMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;

            const msg = { sender: 'Operator', text: text, time: new Date().toLocaleTimeString() };
            db.chat.push(msg);
            saveDB();

            appendChat(msg.sender, msg.text, true);
            channel.postMessage({ type: 'chat', sender: msg.sender, text: msg.text });
            input.value = '';
        }

        // UI Helpers
        function appendFeed(text) {
            const container = document.getElementById('feed-container');
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerText = text;
            container.prepend(item);
            if(container.children.length > 20) container.lastChild.remove();
        }

        function appendChat(sender, text, isMe) {
            const chatBox = document.getElementById('chat-container');
            const item = document.createElement('div');
            item.className = 'feed-item chat-item';
            item.innerText = `${sender}: ${text}`;
            chatBox.appendChild(item);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Listen for updates from other tabs/windows
        channel.onmessage = (event) => {
            if(event.data.type === 'chat') {
                appendChat(event.data.sender, event.data.text, false);
            } else {
                appendFeed(event.data.text);
                updateHUD();
            }
        };
    </script>
</body>
</html>
