<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumberland County Stand & Telemetry Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="p-4 max-w-4xl mx-auto">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 shadow-xl gap-4">
        <div>
            <h1 class="text-lg font-bold text-amber-500 uppercase tracking-wider">Cumberland Stand Intelligence</h1>
            <p class="text-xs text-slate-400">Zone 104 Stand Setup & Trail Cam Log</p>
        </div>
        <div class="flex gap-2">
            <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition font-mono">Export JSON</button>
            <button onclick="clearLogs()" class="bg-rose-950/50 hover:bg-rose-900/50 text-xs text-rose-300 px-3 py-2 rounded-lg border border-rose-900/50 transition font-mono">Clear Logs</button>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Column: Quick Capture Form -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl md:col-span-1">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-4 border-b border-slate-800 pb-2">Log Field Sighting</h2>
            
            <form id="sighting-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Stand / Location ID</label>
                    <input type="text" id="stand-id" value="South Pine Edge Stand" required class="w-full bg-slate-950 border border-slate-700 text-slate-200 rounded-lg p-2 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">Activity / Description</label>
                    <input type="text" id="sighting-desc" placeholder="e.g., 8-point buck moving south" required class="w-full bg-slate-950 border border-slate-700 text-slate-200 rounded-lg p-2 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">Wind Direction</label>
                    <select id="wind-dir" class="w-full bg-slate-950 border border-slate-700 text-slate-200 rounded-lg p-2 focus:outline-none focus:border-amber-500">
                        <option value="North">North</option>
                        <option value="North-West">North-West</option>
                        <option value="West">West</option>
                        <option value="South-West">South-West</option>
                        <option value="South">South</option>
                        <option value="East">East</option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">Attach Photo (Optional)</label>
                    <input type="file" id="photo-input" accept="image/*" class="w-full text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-500 cursor-pointer">
                </div>

                <button type="submit" class="w-full mt-2 py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold uppercase tracking-wider rounded-lg transition shadow-lg cursor-pointer">
                    Save Telemetry Record
                </button>
            </form>
        </section>

        <!-- Right Column: Sighting Logs Feed -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl md:col-span-2 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">Active Field Logs</h2>
                <span id="log-counter" class="text-xs bg-slate-800 text-amber-400 px-2.5 py-1 rounded font-mono border border-slate-700">0 Entries</span>
            </div>

            <div id="logs-container" class="space-y-4 overflow-y-auto max-h-[500px] pr-1">
                <p class="text-xs text-slate-500 font-mono text-center py-8">No field entries logged yet. Use the form to start tracking.</p>
            </div>
        </section>

    </main>

    <!-- Script Engine -->
    <script>
        const STORAGE_KEY = "cumberland_stand_logs_v1";

        function getStoredLogs() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveStoredLogs(logs) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
            renderLogs();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const standId = document.getElementById('stand-id').value;
            const desc = document.getElementById('sighting-desc').value;
            const wind = document.getElementById('wind-dir').value;
            const fileInput = document.getElementById('photo-input');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    addRecord({
                        stand: standId,
                        description: desc,
                        wind: wind,
                        image: uploadEvent.target.result,
                        date: new Date().toLocaleString()
                    });
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                addRecord({
                    stand: standId,
                    description: desc,
                    wind: wind,
                    image: null,
                    date: new Date().toLocaleString()
                });
            }
        }

        function addRecord(record) {
            const logs = getStoredLogs();
            logs.unshift(record); // Add to top
            saveStoredLogs(logs);
            document.getElementById('sighting-form').reset();
            document.getElementById('stand-id').value = "South Pine Edge Stand"; // Keep default convenience
        }

        function deleteLog(index) {
            const logs = getStoredLogs();
            logs.splice(index, 1);
            saveStoredLogs(logs);
        }

        function clearLogs() {
            if (confirm("Clear all recorded field entries?")) {
                localStorage.removeItem(STORAGE_KEY);
                renderLogs();
            }
        }

        function exportData() {
            const logs = getStoredLogs();
            if (logs.length === 0) {
                alert("No data available to export.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `stand_logs_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function renderLogs() {
            const logs = getStoredLogs();
            const container = document.getElementById('logs-container');
            document.getElementById('log-counter').innerText = `${logs.length} Entries`;

            if (logs.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 font-mono text-center py-8">No field entries logged yet. Use the form to start tracking.</p>`;
                return;
            }

            container.innerHTML = logs.map((log, idx) => `
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3 flex flex-col sm:flex-row gap-4 items-start justify-between">
                    <div class="space-y-1 text-xs font-mono">
                        <div class="flex items-center gap-2">
                            <span class="text-amber-400 font-bold">${log.stand}</span>
                            <span class="text-slate-500">|</span>
                            <span class="text-slate-400">${log.date}</span>
                        </div>
                        <p class="text-slate-200 text-sm font-sans font-medium">${log.description}</p>
                        <p class="text-slate-400">Wind: <span class="text-cyan-400">${log.wind}</span></p>
                    </div>
                    ${log.image ? `<img src="${log.image}" class="w-24 h-24 object-cover rounded-md border border-slate-800 shrink-0" />` : ''}
                    <button onclick="deleteLog(${idx})" class="text-rose-400 hover:text-rose-300 text-xs px-2.5 py-1 rounded bg-rose-950/40 border border-rose-900/60 self-end sm:self-start">Delete</button>
                </div>
            `).join('');
        }

        // Initial render
        renderLogs();
    </script>
</body>
</html>
