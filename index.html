<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain & Trail Cam Intelligence Hub (Cesium)</title>
    <!-- CesiumJS CDN -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121619;
            --panel-bg: rgba(18, 22, 25, 0.85);
            --border-color: #2a343d;
            --accent-green: #2ecc71;
            --accent-hover: #27ae60;
            --text-main: #ecf0f1;
            --text-muted: #95a5a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main); }

        #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0; }

        /* Tactical HUD Overlay */
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .hud-header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-main); }
        .status-badge { font-size: 11px; background: rgba(46, 204, 113, 0.2); color: var(--accent-green); padding: 3px 8px; border-radius: 20px; font-weight: 600; }

        /* Drop Zone */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.02);
            margin-bottom: 15px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-green);
            background: rgba(46, 204, 113, 0.05);
        }

        .drop-zone p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
        .drop-zone input { display: none; }

        /* Analysis Output Feed */
        .analysis-box {
            max-height: 220px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            border: 1px solid var(--border-color);
        }

        .analysis-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .analysis-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        .ai-tag { color: var(--accent-green); font-weight: bold; }

        /* Controls Toolbar */
        .map-tools {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent-green); }
        
        /* Hide default Cesium elements for cleaner look */
        .cesium-viewer-bottom { display: none !important; }
    </style>
</head>
<body>

    <!-- 3D Globe Container -->
    <div id="cesiumContainer"></div>

    <!-- UI Overlay Panel -->
    <div class="hud-panel">
        <div class="hud-header">
            <h1>Trail Cam & Habitat AI</h1>
            <span class="status-badge">Cesium 3D Active</span>
        </div>

        <!-- Photo Drop Area -->
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--accent-green);"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <p><strong>Drop trail cam photos here</strong> or click to upload</p>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div class="analysis-box" id="analysisFeed">
            <div class="analysis-item">
                <span class="ai-tag">[System Ready]</span> Upload a trail photo to calculate animal trajectory, plot bedding zones, and project terrain vectors.
            </div>
        </div>
    </div>

    <!-- Bottom Quick Controls -->
    <div class="map-tools">
        <button class="btn" onclick="toggleTerrainView()">Toggle 3D Terrain</button>
        <button class="btn" onclick="addSampleBeddingZone()">Plot Sample Bedding Zone</button>
        <button class="btn" onclick="resetView()">Reset Home View</button>
    </div>

    <script>
        // TODO: Replace with your actual Cesium ion access token from https://ion.cesium.com/
        Cesium.Ion.defaultAccessToken = 'YOUR_CESIUM_ION_TOKEN_HERE';

        // Initialize Cesium Viewer with high-precision World Terrain
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrain: Cesium.Terrain.fromWorldTerrain(),
            baseLayerPicker: false,
            geocoder: true,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            animation: false,
            timeline: false
        });

        // Default home view (Springhill / Northern Nova Scotia region framework)
        const homePosition = Cesium.Cartesian3.fromDegrees(-64.0600, 45.6500, 5000);
        viewer.camera.flyTo({
            destination: homePosition,
            orientation: {
                heading: Cesium.Math.toRadians(0.0),
                pitch: Cesium.Math.toRadians(-45.0),
                roll: 0.0
            }
        });

        function resetView() {
            viewer.camera.flyTo({ destination: homePosition, duration: 1.5 });
        }

        let terrainEnabled = true;
        function toggleTerrainView() {
            terrainEnabled = !terrainEnabled;
            viewer.terrainProvider = terrainEnabled 
                ? Cesium.Terrain.fromWorldTerrain() 
                : new Cesium.EllipsoidTerrainProvider();
        }

        // Handle Drag and Drop for AI Photo Analysis Simulation
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const analysisFeed = document.getElementById('analysisFeed');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                simulateAIAnalysis(file.name);
            });
        }

        function simulateAIAnalysis(filename) {
            // Generate pseudo-random coordinates near current view for demonstration mapping
            const randLat = 45.645 + (Math.random() - 0.5) * 0.02;
            const randLon = -64.055 + (Math.random() - 0.5) * 0.02;

            // Add item to feed
            const item = document.createElement('div');
            item.className = 'analysis-item';
            item.innerHTML = `<span class="ai-tag">[AI Vision]</span> Processed <strong>${filename}</strong>.<br>
            • Detected: Mature buck moving North-West.<br>
            • Origin Vector: Upwind ridge (Bedding probable).<br>
            • Dropped Map Pin: (${randLat.toFixed(4)}, ${randLon.toFixed(4)})`;
            analysisFeed.prepend(item);

            // Plot interactive pin & vector cone on Cesium 3D Globe
            plotIntelligencePoint(randLon, randLat, filename);
        }

        function plotIntelligencePoint(lon, lat, label) {
            // Trail Camera Marker
            viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(lon, lat),
                point: {
                    pixelSize: 12,
                    color: Cesium.Color.ORANGE,
                    outlineColor: Cesium.Color.WHITE,
                    outlineWidth: 2
                },
                label: {
                    text: `Cam: ${label}`,
                    font: '12px sans-serif',
                    fillColor: Cesium.Color.WHITE,
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    outlineWidth: 2,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -15)
                }
            });

            // Simulated Bedding Zone Polygon 
            viewer.entities.add({
                polygon: {
                    hierarchy: Cesium.Cartesian3.fromDegreesArray([
                        lon - 0.003, lat + 0.003,
                        lon + 0.001, lat + 0.004,
                        lon + 0.002, lat + 0.001,
                        lon - 0.001, lat + 0.001
                    ]),
                    material: Cesium.Color.RED.withAlpha(0.3),
                    outline: true,
                    outlineColor: Cesium.Color.RED
                }
            });

            // Fly camera smoothly to the new intel drop
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1200),
                duration: 2.0
            });
        }

        function addSampleBeddingZone() {
            simulateAIAnalysis("Sample_TrailCam_042.jpg");
        }
    </script>
</body>
</html>
