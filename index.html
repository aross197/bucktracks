<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucktracks Dashboard</title>
    <!-- Leaflet CSS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --muted-color: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.75rem;
        }

        header p {
            margin: 0.25rem 0 0;
            color: var(--muted-color);
            font-size: 0.875rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 0.75rem;
            font-size: 1.15rem;
            color: var(--accent-color);
        }

        #map {
            width: 100%;
            height: 280px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            z-index: 1;
        }

        .form-group {
            margin-bottom: 0.875rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.85rem;
            color: var(--muted-color);
        }

        input, textarea {
            width: 100%;
            padding: 0.65rem;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); }

        .log-item {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            color: var(--muted-color);
            font-size: 0.8rem;
            margin-bottom: 0.35rem;
        }

        .delete-btn {
            background: transparent;
            color: #ef4444;
            border: none;
            padding: 0;
            width: auto;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .delete-btn:hover { text-decoration: underline; background: transparent; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Bucktracks</h1>
            <p>Mapping & Field Tracking System</p>
        </header>

        <!-- MAP VIEW CARD -->
        <div class="card">
            <h3>🗺️ Interactive Map (Tap to Pin)</h3>
            <div id="map"></div>
        </div>

        <!-- QUICK FIELD LOG -->
        <div class="card">
            <h3>📝 Quick Field Log</h3>
            <form id="log-form">
                <div class="form-group">
                    <label for="log-location">Location / Coordinates</label>
                    <input type="text" id="log-location" placeholder="Tap map or enter location..." required>
                </div>
                <div class="form-group">
                    <label for="log-notes">Observations / Notes</label>
                    <textarea id="log-notes" rows="2" placeholder="Sign found, wind conditions, camera ID..." required></textarea>
                </div>
                <button type="submit">Save Log Entry</button>
            </form>
        </div>

        <!-- LOG HISTORY -->
        <div class="card">
            <h3>📋 Saved History</h3>
            <div id="logs-container">
                <p style="color: var(--muted-color); font-size: 0.875rem; text-align: center;">No logs saved yet.</p>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered around Cumberland County / Nova Scotia region
        const map = L.map('map').setView([45.5, -64.2], 9);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let activeMarker = null;

        // Tapping map drops/moves a pin and autofills the location form field
        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(4);
            const lng = e.latlng.lng.toFixed(4);
            
            if (activeMarker) {
                map.removeLayer(activeMarker);
            }
            
            activeMarker = L.marker([lat, lng]).addTo(map)
              .bindPopup(`Lat: ${lat}, Lng: ${lng}`).openPopup();
            
            document.getElementById('log-location').value = `Lat: ${lat}, Lng: ${lng}`;
        });

        // Handle Form Storage & UI Loading
        document.addEventListener('DOMContentLoaded', loadLogs);

        document.getElementById('log-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const location = document.getElementById('log-location').value.trim();
            const notes = document.getElementById('log-notes').value.trim();
            const dateStr = new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });

            if (!location || !notes) return;

            const newEntry = { id: Date.now(), location, notes, date: dateStr };
            let logs = JSON.parse(localStorage.getItem('bucktracks_map_logs') || '[]');
            logs.unshift(newEntry);
            localStorage.setItem('bucktracks_map_logs', JSON.stringify(logs));

            document.getElementById('log-location').value = '';
            document.getElementById('log-notes').value = '';
            if (activeMarker) {
                map.removeLayer(activeMarker);
                activeMarker = null;
            }
            loadLogs();
        });

        function loadLogs() {
            const container = document.getElementById('logs-container');
            const logs = JSON.parse(localStorage.getItem('bucktracks_map_logs') || '[]');

            if (logs.length === 0) {
                container.innerHTML = '<p style="color: var(--muted-color); font-size: 0.875rem; text-align: center;">No logs saved yet.</p>';
                return;
            }

            container.innerHTML = '';
            logs.forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `
                    <div class="log-header">
                        <span><strong>${escapeHTML(log.location)}</strong></span>
                        <span>${log.date}</span>
                    </div>
                    <p style="margin: 0.25rem 0 0.5rem;">${escapeHTML(log.notes)}</p>
                    <button class="delete-btn" onclick="deleteLog(${log.id})">Delete entry</button>
                `;
                container.appendChild(div);
            });
        }

        function deleteLog(id) {
            let logs = JSON.parse(localStorage.getItem('bucktracks_map_logs') || '[]');
            logs = logs.filter(l => l.id !== id);
            localStorage.setItem('bucktracks_map_logs', JSON.stringify(logs));
            loadLogs();
        }

        // Basic helper to prevent layout break injections from text input
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
