<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BUCKTRACK PRO | Apex Deer Intelligence & GIS</title>

<!-- Leaflet Core -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- SunCalc for precise Solunar/Sun/Moon math -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

<style>
:root {
  --bg: #050806;
  --surface: rgba(12, 18, 14, 0.88);
  --surface-solid: #0d1410;
  --surface-elevated: #131d17;
  --border: rgba(255, 255, 255, 0.08);
  --border-active: #f08a2e;
  
  --accent: #f08a2e;
  --accent-glow: rgba(240, 138, 46, 0.2);
  --mint: #50e3c2;
  --mint-glow: rgba(80, 227, 194, 0.15);
  --red: #ff453a;
  --blue: #00d2ff;
  --yellow: #ffd60a;
  
  --text: #f0f4f1;
  --text-dim: #7a8f83;
  
  --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "IBM Plex Mono", Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); font-family: var(--font-main); overflow: hidden; }

/* Dynamic Layout Framework */
.app-viewport {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100vw;
  position: relative;
  overflow: hidden;
}

/* Minimal Top Bar */
header {
  height: 44px;
  background: var(--surface-solid);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  z-index: 1000;
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.05em;
  color: var(--text);
}
.brand-badge {
  background: var(--accent);
  color: #000;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.6rem;
  padding: 2px 5px;
  border-radius: 3px;
}
.solunar-pill {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--mint);
  background: var(--mint-glow);
  border: 1px solid rgba(80, 227, 194, 0.3);
  padding: 3px 8px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Main Workspace Split */
.workspace {
  flex: 1;
  position: relative;
  display: flex;
  overflow: hidden;
}

/* Map Engine Viewport */
#map-container {
  flex: 1;
  height: 100%;
  position: relative;
  background: #020403;
}
#map { width: 100%; height: 100%; z-index: 1; }

/* Floating Map Controls */
.map-top-bar {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 500;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}
.map-chip {
  pointer-events: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(16px);
  padding: 6px 10px;
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  gap: 8px;
}
.map-chip .val { color: var(--accent); font-weight: 700; }

.map-btn-group {
  pointer-events: auto;
  display: flex;
  gap: 6px;
}
.map-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 0.72rem;
  font-weight: 600;
  backdrop-filter: blur(16px);
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.map-btn:hover, .map-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--surface-elevated);
}

/* Legend & Layer Control Drawer */
.layer-panel {
  position: absolute;
  top: 50px;
  right: 10px;
  width: 280px;
  max-height: calc(100% - 70px);
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  z-index: 600;
  display: none;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.8);
  overflow-y: auto;
}
.layer-panel.open { display: flex; }
.panel-section-title {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}
.layer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
}
.layer-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.layer-row input[type="checkbox"], .layer-row input[type="radio"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

/* Integrated Hunting AI Drawer Panel */
.ai-panel {
  width: 360px;
  height: 100%;
  background: var(--surface-solid);
  border-left: 1px solid var(--border);
  z-index: 700;
  display: flex;
  flex-direction: column;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

@media (max-width: 768px) {
  .ai-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: 55%;
    border-left: none;
    border-top: 1px solid var(--border);
    transform: translateY(100%);
  }
  .ai-panel.mobile-open { transform: translateY(0); }
}

.ai-head {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.02);
}
.ai-head h2 { font-size: 0.78rem; font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.05em; }

.chat-log {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg {
  max-width: 90%;
  padding: 8px 11px;
  border-radius: 8px;
  font-size: 0.78rem;
  line-height: 1.4;
}
.msg.system {
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  align-self: flex-start;
}
.msg.user {
  background: var(--accent);
  color: #000;
  font-weight: 600;
  align-self: flex-end;
}

.ai-input-bar {
  padding: 8px 10px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
  background: var(--bg);
}
.ai-input-bar input {
  flex: 1;
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  color: #fff;
  font-size: 0.78rem;
  outline: none;
}
.ai-input-bar input:focus { border-color: var(--accent); }
.ai-input-bar button {
  background: var(--accent);
  border: none;
  padding: 0 12px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 700;
  color: #000;
  cursor: pointer;
}

/* Mobile Bottom Navigation Dock */
.mobile-dock {
  display: none;
  height: 48px;
  background: var(--surface-solid);
  border-top: 1px solid var(--border);
  z-index: 1000;
  padding: 0 12px;
}
@media (max-width: 768px) {
  .mobile-dock { display: flex; align-items: center; justify-content: space-around; }
}
.dock-tab {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 0.72rem;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
}
.dock-tab.active { color: var(--accent); }

/* Wind Cone Graphic Canvas Overlay */
.wind-indicator {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--mint);
  display: flex;
  align-items: center;
  gap: 4px;
}
</style>
</head>
<body>

<div class="app-viewport">
  <!-- Minimalist Header -->
  <header>
    <div class="brand">
      <div class="brand-badge">PRO</div>
      <span>BUCKTRACK APEX GIS</span>
    </div>
    <div class="solunar-pill" id="solunar-badge">
      <span>SOLUNAR: EXCELLENT (89%)</span>
    </div>
  </header>

  <!-- Main Viewport -->
  <div class="workspace">
    <!-- Map Engine Canvas -->
    <div id="map-container">
      <div id="map"></div>

      <!-- Floating Map Top Controls -->
      <div class="map-top-bar">
        <div class="map-chip">
          <span>WIND:</span>
          <span class="val" id="hud-wind">12 km/h WNW</span>
          <span class="wind-indicator" id="hud-baro">1018 hPa ↗</span>
        </div>
        <div class="map-btn-group">
          <button class="map-btn" onclick="locateUser()">📍 Center</button>
          <button class="map-btn" id="btn-layers" onclick="toggleLayerDrawer()">🗺️ Layers & Legend</button>
        </div>
      </div>

      <!-- Layers & Interactive Legend Drawer -->
      <div class="layer-panel" id="layer-panel">
        <div class="panel-section-title">Basemap Engine</div>
        <div class="layer-row">
          <label><input type="radio" name="base" value="sat" checked onchange="setBaseMap('sat')"> High-Res Satellite</label>
        </div>
        <div class="layer-row">
          <label><input type="radio" name="base" value="topo" onchange="setBaseMap('topo')"> Topo Contour Engine</label>
        </div>

        <div class="panel-section-title" style="margin-top:6px;">Deer GIS Overlays</div>
        <div class="layer-row">
          <label><span class="swatch" style="background:#ff453a;"></span> Bedding Cores</label>
          <input type="checkbox" id="chk-bedding" checked onchange="toggleOverlay('bedding', this.checked)">
        </div>
        <div class="layer-row">
          <label><span class="swatch" style="background:#00d2ff;"></span> Thermal Funnels</label>
          <input type="checkbox" id="chk-thermal" checked onchange="toggleOverlay('thermal', this.checked)">
        </div>
        <div class="layer-row">
          <label><span class="swatch" style="background:#ffd60a;"></span> Active Scrapes</label>
          <input type="checkbox" id="chk-scrapes" checked onchange="toggleOverlay('scrapes', this.checked)">
        </div>
        <div class="layer-row">
          <label><span class="swatch" style="background:#f08a2e;"></span> Scent Cone Vector</label>
          <input type="checkbox" id="chk-scent" checked onchange="toggleOverlay('scent', this.checked)">
        </div>
        <div class="layer-row">
          <label><span class="swatch" style="background:#50e3c2;"></span> Crown Land Polygons</label>
          <input type="checkbox" id="chk-crown" checked onchange="toggleOverlay('crown', this.checked)">
        </div>
      </div>
    </div>

    <!-- Hunting Intelligence AI Panel -->
    <div class="ai-panel" id="ai-panel">
      <div class="ai-head">
        <h2>DEER BEHAVIOR AI DISPATCH</h2>
        <span style="font-family:var(--font-mono); font-size:0.6rem; color:var(--text-dim);" id="coords-display">45.8167, -64.2167</span>
      </div>

      <div class="chat-log" id="chat-log">
        <div class="msg system">
          <strong>Apex Intelligence:</strong> GIS Engine initialized. Live weather, Solunar peaks, and scent vectors calculated for current coordinates.
        </div>
      </div>

      <div class="ai-input-bar">
        <input type="text" id="ai-input" placeholder="Ask AI (e.g. Best stand for WNW wind?)" onkeydown="if(event.key==='Enter') sendQuery()">
        <button onclick="sendQuery()">Ask</button>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Dock -->
  <div class="mobile-dock">
    <button class="dock-tab active" id="tab-map" onclick="switchMobileTab('map')">🗺️ Map View</button>
    <button class="dock-tab" id="tab-ai" onclick="switchMobileTab('ai')">🤖 Tactical AI</button>
  </div>
</div>

<script>
let map;
let baseLayers = {};
let overlays = {};
let userMarker, scentConePolygon;
let currentLat = 45.8167, currentLng = -64.2167;
let windDeg = 292.5; // WNW Wind

// Initialize Leaflet GIS Engine
function initGIS() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([currentLat, currentLng], 14);

  // Basemap Tiles
  baseLayers.sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });
  baseLayers.topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 });
  baseLayers.sat.addTo(map);

  // User Marker
  userMarker = L.circleMarker([currentLat, currentLng], {
    radius: 7, fillColor: '#f08a2e', color: '#ffffff', weight: 2, fillOpacity: 1
  }).addTo(map).bindPopup("<b>Your Current Position</b>");

  // Create Tactical Deer Overlays
  setupTacticalOverlays();

  // Recalculate Solunar Math dynamically
  calculateSolunar(currentLat, currentLng);

  // Fetch Live Weather & Pressure
  fetchWeather(currentLat, currentLng);

  // Map click inspector
  map.on('click', (e) => {
    const lat = e.latlng.lat.toFixed(4);
    const lng = e.latlng.lng.toFixed(4);
    document.getElementById('coords-display').textContent = `${lat}, ${lng}`;
  });
}

function setupTacticalOverlays() {
  // Bedding Core Zone
  overlays.bedding = L.circle([currentLat + 0.005, currentLng - 0.008], {
    color: '#ff453a', fillColor: '#ff453a', fillOpacity: 0.35, radius: 280
  }).bindPopup("<b>Primary Bedding Core</b><br>Thick cover / Ridge bench.");

  // Thermal Funnel Corridor
  overlays.thermal = L.polyline([
    [currentLat - 0.008, currentLng - 0.012],
    [currentLat - 0.002, currentLng - 0.005],
    [currentLat + 0.004, currentLng]
  ], { color: '#00d2ff', weight: 4 }).bindPopup("<b>Thermal Pinch Point</b><br>Morning funnel route.");

  // Active Scrapes
  overlays.scrapes = L.layerGroup([
    L.circleMarker([currentLat + 0.002, currentLng + 0.004], { radius: 6, color: '#ffd60a', fillColor: '#ffd60a', fillOpacity: 0.9 }).bindPopup("<b>Primary Scrape</b>"),
    L.circleMarker([currentLat + 0.004, currentLng + 0.006], { radius: 6, color: '#ffd60a', fillColor: '#ffd60a', fillOpacity: 0.9 }).bindPopup("<b>Secondary Scrape</b>")
  ]);

  // Crown Land Polygon
  overlays.crown = L.polygon([
    [currentLat - 0.012, currentLng - 0.020],
    [currentLat + 0.015, currentLng - 0.020],
    [currentLat + 0.015, currentLng - 0.008],
    [currentLat - 0.012, currentLng - 0.008]
  ], { color: '#50e3c2', weight: 2, fillColor: '#50e3c2', fillOpacity: 0.12, dashArray: '4,4' }).bindPopup("<b>Crown Land Parcel</b>");

  // Dynamic Downwind Scent Cone Calculation
  calculateScentCone(currentLat, currentLng, windDeg);

  // Add all layers to map by default
  Object.keys(overlays).forEach(k => overlays[k].addTo(map));
}

function calculateScentCone(lat, lng, windDirectionDeg) {
  // Scent drifts downwind (opposite direction wind comes from)
  const driftDeg = (windDirectionDeg + 180) % 360;
  const coneAngle = 35; // 35 degree dispersion cone
  const distanceKm = 0.8; // 800 meter scent trail

  const leftAngle = (driftDeg - coneAngle / 2) * (Math.PI / 180);
  const rightAngle = (driftDeg + coneAngle / 2) * (Math.PI / 180);

  // Rough lat/lng offsetting for cone drawing
  const latOffsetLeft = (distanceKm / 111) * Math.cos(leftAngle);
  const lngOffsetLeft = (distanceKm / (111 * Math.cos(lat * Math.PI / 180))) * Math.sin(leftAngle);

  const latOffsetRight = (distanceKm / 111) * Math.cos(rightAngle);
  const lngOffsetRight = (distanceKm / (111 * Math.cos(lat * Math.PI / 180))) * Math.sin(rightAngle);

  const p1 = [lat, lng];
  const p2 = [lat + latOffsetLeft, lng + lngOffsetLeft];
  const p3 = [lat + latOffsetRight, lng + lngOffsetRight];

  if (scentConePolygon) map.removeLayer(scentConePolygon);

  scentConePolygon = L.polygon([p1, p2, p3], {
    color: '#f08a2e', weight: 1, fillColor: '#f08a2e', fillOpacity: 0.25, dashArray: '3,3'
  }).bindPopup("<b>Downwind Scent Cone</b><br>High detection risk zone.");

  overlays.scent = scentConePolygon;
  overlays.scent.addTo(map);
}

function setBaseMap(type) {
  if (type === 'sat') {
    map.removeLayer(baseLayers.topo);
    baseLayers.sat.addTo(map);
  } else {
    map.removeLayer(baseLayers.sat);
    baseLayers.topo.addTo(map);
  }
}

function toggleOverlay(key, enable) {
  if (enable) overlays[key].addTo(map);
  else map.removeLayer(overlays[key]);
}

function toggleLayerDrawer() {
  document.getElementById('layer-panel').classList.toggle('open');
}

function locateUser() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((pos) => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      map.setView([currentLat, currentLng], 14);
      userMarker.setLatLng([currentLat, currentLng]);
      calculateScentCone(currentLat, currentLng, windDeg);
      fetchWeather(currentLat, currentLng);
    });
  }
}

// Solunar Math using SunCalc
function calculateSolunar(lat, lng) {
  const times = SunCalc.getTimes(new Date(), lat, lng);
  const moonIllum = SunCalc.getMoonIllumination(new Date());
  
  const rating = Math.round(moonIllum.fraction * 100);
  document.getElementById('solunar-badge').innerHTML = `<span>SOLUNAR: ${rating > 70 ? 'EXCELLENT' : 'MODERATE'} (${rating}%)</span>`;
}

// Live Weather Call
async function fetchWeather(lat, lng) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=surface_pressure,wind_speed_10m,wind_direction_10m`);
    const data = await res.json();
    
    const windKm = Math.round(data.current.wind_speed_10m);
    windDeg = data.current.wind_direction_10m;
    const baro = Math.round(data.current.surface_pressure);

    document.getElementById('hud-wind').textContent = `${windKm} km/h ${getCardinalWind(windDeg)}`;
    document.getElementById('hud-baro').textContent = `${baro} hPa ↗`;

    // Recalculate scent cone with fresh wind direction
    calculateScentCone(lat, lng, windDeg);
  } catch(e) {
    console.log("Weather offline, using tactical default.");
  }
}

function getCardinalWind(deg) {
  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  return dirs[Math.round(deg / 45) % 8];
}

// AI Chat Intelligence
function sendQuery() {
  const input = document.getElementById('ai-input');
  const txt = input.value.trim();
  if (!txt) return;

  const log = document.getElementById('chat-log');
  
  // User Message
  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.textContent = txt;
  log.appendChild(userDiv);
  
  input.value = '';
  log.scrollTop = log.scrollHeight;

  // Tactical Response Logic
  setTimeout(() => {
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg system';
    
    let reply = `<strong>Apex Intelligence:</strong> Based on the active <strong>${document.getElementById('hud-wind').textContent}</strong> wind and bedding placement:<br><br>`;
    
    if (txt.toLowerCase().includes("stand") || txt.toLowerCase().includes("where")) {
      reply += `• Set up 40 yards southeast of the thermal corridor to keep your downwind scent cone out of the primary bedding zone.`;
    } else if (txt.toLowerCase().includes("rut") || txt.toLowerCase().includes("call")) {
      reply += `• Peak seeking activity detected. Use light contact grunts paired with blind rattling sequences every 45 minutes.`;
    } else {
      reply += `• Pressure is holding steady. Deer travel will favor the leeward side of the ridge. Stay downwind of the yellow scrape markers.`;
    }

    aiDiv.innerHTML = reply;
    log.appendChild(aiDiv);
    log.scrollTop = log.scrollHeight;
  }, 500);
}

// Mobile Tab Switcher
function switchMobileTab(tab) {
  const aiPanel = document.getElementById('ai-panel');
  const tabMap = document.getElementById('tab-map');
  const tabAi = document.getElementById('tab-ai');

  if (tab === 'ai') {
    aiPanel.classList.add('mobile-open');
    tabAi.classList.add('active');
    tabMap.classList.remove('active');
  } else {
    aiPanel.classList.remove('mobile-open');
    tabMap.classList.add('active');
    tabAi.classList.remove('active');
  }
}

window.onload = initGIS;
</script>
</body>
</html>
