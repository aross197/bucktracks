<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Hosted Auth App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .form-box { display: none; }
        .form-box.active { display: block; }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
        }

        .input-group { margin-bottom: 1rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus { outline: none; border-color: var(--accent-color); }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); }

        .switch-text {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .switch-text span {
            color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
        }

        .switch-text span:hover { text-decoration: underline; }

        .message {
            margin-top: 1rem;
            font-size: 0.875rem;
            text-align: center;
            min-height: 1.25rem;
        }

        .error { color: var(--error-color); }
        .success { color: var(--success-color); }

        #dashboard-view { text-align: center; }
        #dashboard-view button { background: var(--error-color); }
        #dashboard-view button:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN FORM -->
        <div id="login-box" class="form-box active">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Log In</button>
            </form>
            <div id="login-msg" class="message"></div>
            <div class="switch-text">
                Don't have an account? <span onclick="switchForm('register')">Register here</span>
            </div>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-box" class="form-box">
            <h2>Create Account</h2>
            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit">Register</button>
            </form>
            <div id="register-msg" class="message"></div>
            <div class="switch-text">
                Already have an account? <span onclick="switchForm('login')">Log in</span>
            </div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="form-box">
            <h2>Dashboard</h2>
            <p>Welcome back, <span id="user-display-name" style="color: var(--accent-color); font-weight: bold;"></span>!</p>
            <p style="color: #94a3b8; font-size: 0.875rem;">Hosted live on GitHub Pages.</p>
            <button onclick="logout()">Log Out</button>
        </div>
    </div>

    <script>
        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const activeUser = sessionStorage.getItem('logged_in_user');
            if (activeUser) {
                showDashboard(activeUser);
            }
        });

        function switchForm(formType) {
            document.getElementById('login-box').classList.remove('active');
            document.getElementById('register-box').classList.remove('active');
            document.getElementById('login-msg').textContent = '';
            document.getElementById('register-msg').textContent = '';

            if (formType === 'login') {
                document.getElementById('login-box').classList.add('active');
            } else {
                document.getElementById('register-box').classList.add('active');
            }
        }

        // Handle Registration
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const msgEl = document.getElementById('register-msg');

            let users = JSON.parse(localStorage.getItem('gh_users') || '[]');
            
            if (users.some(u => u.email === email)) {
                msgEl.textContent = 'Email is already registered. Try logging in.';
                msgEl.className = 'message error';
                return;
            }

            const hashedPassword = await hashPassword(password);
            users.push({ name, email, password: hashedPassword });
            localStorage.setItem('gh_users', JSON.stringify(users));

            msgEl.textContent = 'Registration successful! Switching to login...';
            msgEl.className = 'message success';
            setTimeout(() => {
                switchForm('login');
                document.getElementById('register-form').reset();
                msgEl.textContent = '';
            }, 1200);
        });

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const msgEl = document.getElementById('login-msg');

            let users = JSON.parse(localStorage.getItem('gh_users') || '[]');
            
            if (users.length === 0) {
                msgEl.textContent = 'No accounts found. Please register first.';
                msgEl.className = 'message error';
                return;
            }

            const hashedPassword = await hashPassword(password);
            const user = users.find(u => u.email === email && u.password === hashedPassword);

            if (user) {
                sessionStorage.setItem('logged_in_user', user.name);
                showDashboard(user.name);
                document.getElementById('login-form').reset();
                msgEl.textContent = '';
            } else {
                msgEl.textContent = 'Invalid email or password.';
                msgEl.className = 'message error';
            }
        });

        function logout() {
            sessionStorage.removeItem('logged_in_user');
            document.getElementById('dashboard-view').classList.remove('active');
            switchForm('login');
        }

        function showDashboard(name) {
            document.getElementById('login-box').classList.remove('active');
            document.getElementById('register-box').classList.remove('active');
            document.getElementById('dashboard-view').classList.add('active');
            document.getElementById('user-display-name').textContent = name;
        }
    </script>
</body>
</html>
