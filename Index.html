<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area 51 Music</title>

    <!-- Apple Touch Icon for Home Screen -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'%3E%3Crect width='100%' height='100%' fill='%23111923'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' fill='%235cff9d' font-size='90' font-family='monospace'%3E👽%3C/text%3E%3C/svg%3E">
    
    <!-- PWA Web App Manifest Inline Data -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Area%2051%20Music%22%2C%22short_name%22%3A%22Area%2051%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23111923%22%2C%22theme_color%22%3A%22%235cff9d%22%7D">

    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #111923;
            --accent: #5cff9d;
            --text-main: #f0f4f8;
            --text-muted: #8899a6;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 120px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .search-box input {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            width: 160px;
            transition: width 0.3s ease;
        }

        .search-box input:focus {
            width: 220px;
            border-color: var(--accent);
        }

        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero {
            background: linear-gradient(135deg, #111923, #1a2636);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: center;
        }

        .hero b {
            font-size: 1.5rem;
            color: var(--accent);
            display: block;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .status {
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 12px;
            font-family: monospace;
        }

        .section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section h2 {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .section span {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            gap: 14px;
            transition: border-color 0.2s;
        }

        .track:hover {
            border-color: var(--accent);
        }

        .cover {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            background: #1a2636;
        }

        .info {
            flex-grow: 1;
            min-width: 0;
        }

        .title {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .artist {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .icon:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .icon.play {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
        }

        /* Player Bar Footer */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
        }

        .player-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .player-cover {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            background: #1a2636;
        }

        .player-details .title {
            font-size: 0.85rem;
        }

        .player-details .artist {
            font-size: 0.75rem;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-display {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .loading, .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-family: monospace;
        }

        /* Toast Popup Notification */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--accent);
            color: var(--bg-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 1100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">👽 AREA 51 MUSIC</div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Search tracks...">
        </div>
    </header>

    <main id="content">
        <!-- Dynamic Content injected via JS -->
    </main>

    <!-- Global Audio Element -->
    <audio id="audio"></audio>

    <!-- Sticky Persistent Player Footer -->
    <div class="player-bar">
        <div class="progress-container" onclick="seekAudio(event)">
            <div id="bar" class="progress-bar"></div>
        </div>
        <div class="player-content">
            <div class="player-info">
                <img id="nowCover" class="player-cover" src="" alt="">
                <div class="player-details">
                    <div id="nowTitle" class="title">Select a track</div>
                    <div id="nowArtist" class="artist">Area 51 Network</div>
                </div>
            </div>
            <div class="player-controls">
                <span id="cur" class="time-display">0:00</span>
                <button id="prev" class="icon" style="width:32px;height:32px;">⏮</button>
                <button id="play" class="icon play" style="width:36px;height:36px;">▶</button>
                <button id="next" class="icon" style="width:32px;height:32px;">⏭</button>
                <span id="dur" class="time-display">0:00</span>
            </div>
        </div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="toast"></div>

    <script>
        /* ============================================================
           AREA 51 MUSIC — 100% FUNCTIONAL LIVE JAMENDO APP
           ============================================================ */

        const JAMENDO_CLIENT_ID = "0078d430";
        const JAMENDO_TRACKS_API = "https://api.jamendo.com/v3.0/tracks/";

        let tracks = [];
        let filteredTracks = [];
        let currentTrack = -1;
        let queue = [];
        let jsonpCounter = 0;

        const audio = document.getElementById("audio");

        function jamendoRequest(params = {}) {
            return new Promise((resolve, reject) => {
                const callbackName = "__a51Jamendo_" + Date.now() + "_" + (++jsonpCounter);
                const script = document.createElement("script");
                const url = new URL(JAMENDO_TRACKS_API);

                url.searchParams.set("client_id", JAMENDO_CLIENT_ID);
                url.searchParams.set("format", "json");
                url.searchParams.set("callback", callbackName);

                Object.keys(params).forEach(key => {
                    if (params[key] !== undefined && params[key] !== null && params[key] !== "") {
                        url.searchParams.set(key, params[key]);
                    }
                });

                let finished = false;

                const cleanup = () => {
                    try { delete window[callbackName]; } catch(e) { window[callbackName] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                };

                const timer = setTimeout(() => {
                    if (finished) return;
                    finished = true;
                    cleanup();
                    reject(new Error("Catalogue connection timed out."));
                }, 12000);

                window[callbackName] = data => {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    cleanup();

                    if (!data || !data.headers || data.headers.status !== "success") {
                        reject(new Error(data?.headers?.error_message || "Jamendo API returned a restriction error."));
                        return;
                    }
                    resolve(data.results || []);
                };

                script.onerror = () => {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    cleanup();
                    reject(new Error("Could not connect to live servers."));
                };

                script.src = url.toString();
                document.head.appendChild(script);
            });
        }

        async function loadMusicCatalogue() {
            showCatalogueLoading();
            try {
                tracks = await jamendoRequest({
                    limit: 50,
                    offset: 0,
                    order: "popularity_week_desc",
                    audioformat: "mp32",
                    imagesize: 300
                });

                if (!tracks || !tracks.length) {
                    tracks = await jamendoRequest({
                        limit: 50,
                        offset: 0,
                        order: "popularity_total_desc",
                        audioformat: "mp32",
                        imagesize: 300
                    });
                }

                filteredTracks = tracks;
                renderCatalogue();
            } catch(error) {
                showCatalogueError(error);
            }
        }

        function showCatalogueLoading() {
            const content = document.getElementById("content");
            if (!content) return;
            content.innerHTML = `
                <div class="hero">
                    <b>AREA 51 MUSIC</b>
                    <p>Connecting to live Jamendo independent catalogue...</p>
                    <div class="status">● CONNECTING</div>
                </div>
                <div class="loading">LOADING LIVE CATALOGUE...</div>
            `;
        }

        function showCatalogueError(error) {
            const content = document.getElementById("content");
            if (!content) return;
            content.innerHTML = `
                <div class="hero">
                    <b>CATALOGUE CONNECTION ERROR</b>
                    <p>${escapeHTML(error?.message || "Unknown error")}</p>
                    <button class="btn primary" onclick="loadMusicCatalogue()">↻ TRY AGAIN</button>
                    <div class="status">CLIENT ID: ${JAMENDO_CLIENT_ID}</div>
                </div>
                <div class="empty">Check your network connection or try again later.</div>
            `;
        }

        function renderCatalogue() {
            const content = document.getElementById("content");
            if (!content) return;

            content.innerHTML = `
                <div class="hero">
                    <b>AREA 51 MUSIC</b>
                    <p>Live independent music stream. Stream tracks or download files permitted by artists.</p>
                    <button class="btn" onclick="playAllMusic()">▶ PLAY ALL</button>
                    <div class="status">● ${tracks.length} LIVE TRACKS AVAILABLE</div>
                </div>
                <div class="section">
                    <h2>DISCOVER MUSIC</h2>
                    <span>JAMENDO LIVE</span>
                </div>
                <div id="musicList" class="grid"></div>
            `;
            renderMusicList();
        }

        function renderMusicList() {
            const box = document.getElementById("musicList");
            if (!box) return;

            if (!filteredTracks.length) {
                box.innerHTML = `<div class="empty">No tracks found matching criteria.</div>`;
                return;
            }

            box.innerHTML = filteredTracks.map((track, index) => {
                const image = track.image || track.album_image || "";
                const downloadable = track.audiodownload_allowed === true;

                return `
                    <div class="track">
                        <img class="cover" src="${escapeHTML(image)}" loading="lazy" 
                            onerror="this.src='data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'300\'><rect width=\'100%\' height=\'100%\' fill=\'#111923\'/><text x=\'50%\' y=\'55%\' text-anchor=\'middle\' fill=\'#5cff9d\' font-size=\'40\' font-family=\'monospace\'>A51</text></svg>')">
                        <div class="info">
                            <div class="title">${escapeHTML(track.name)}</div>
                            <div class="artist">${escapeHTML(track.artist_name || "Unknown Artist")} • ${formatTime(track.duration)}</div>
                        </div>
                        <div class="actions">
                            ${downloadable ? 
                                `<button class="icon" onclick="downloadJamendoTrack(${index})" title="Download">↓</button>` : 
                                `<button class="icon" onclick="showToast('Download restricted')" title="Unavailable">🔒</button>`
                            }
                            <button class="icon play" onclick="playMusic(${index})" title="Play">▶</button>
                        </div>
                    </div>
                `;
            }).join("");
        }

        async function playMusic(index) {
            const track = filteredTracks[index];
            if (!track) return;

            queue = filteredTracks.slice();
            currentTrack = index;

            let audioURL = track.audio;
            if (!audioURL || audioURL.startsWith("http:")) {
                audioURL = `https://api.jamendo.com/v3.0/tracks/file/?client_id=${encodeURIComponent(JAMENDO_CLIENT_ID)}&id=${encodeURIComponent(track.id)}&audioformat=mp32&action=stream`;
            }

            audio.src = audioURL;
            audio.load();
            updateNowPlaying(track);

            try {
                await audio.play();
            } catch (error) {
                showToast("Tap ▶ to start audio output");
            }
        }

        function playAllMusic() {
            if (!filteredTracks.length) {
                showToast("Catalogue queue is empty");
                return;
            }
            playMusic(0);
        }

        function playNextMusic() {
            if (!queue.length) return;
            currentTrack = (currentTrack + 1) % queue.length;
            executeQueueTrack(queue[currentTrack]);
        }

        function playPreviousMusic() {
            if (!queue.length) return;
            currentTrack = (currentTrack - 1 + queue.length) % queue.length;
            executeQueueTrack(queue[currentTrack]);
        }

        function executeQueueTrack(track) {
            const index = filteredTracks.findIndex(x => String(x.id) === String(track.id));
            if (index >= 0) {
                playMusic(index);
            } else {
                playQueueDirect(track);
            }
        }

        function playQueueDirect(track) {
            if (!track) return;
            let source = track.audio;
            if (!source) {
                source = `https://api.jamendo.com/v3.0/tracks/file/?client_id=${encodeURIComponent(JAMENDO_CLIENT_ID)}&id=${encodeURIComponent(track.id)}&audioformat=mp32&action=stream`;
            }
            audio.src = source;
            audio.load();
            updateNowPlaying(track);
            audio.play().catch(() => showToast("Tap ▶ to start playback"));
        }

        function updateNowPlaying(track) {
            const cover = document.getElementById("nowCover");
            const title = document.getElementById("nowTitle");
            const artist = document.getElementById("nowArtist");

            if (cover) cover.src = track.image || track.album_image || "";
            if (title) title.textContent = track.name || "Unknown Track";
            if (artist) artist.textContent = track.artist_name || "Unknown Artist";
        }

        function seekAudio(event) {
            if (!audio.duration) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        }

        const playButton = document.getElementById("play");
        const previousButton = document.getElementById("prev");
        const nextButton = document.getElementById("next");

        if (playButton) {
            playButton.onclick = () => {
                if (!audio.src) {
                    playAllMusic();
                    return;
                }
                if (audio.paused) audio.play();
                else audio.pause();
            };
        }
        if (previousButton) previousButton.onclick = playPreviousMusic;
        if (nextButton) nextButton.onclick = playNextMusic;

        audio.addEventListener("play", () => { if (playButton) playButton.textContent = "Ⅱ"; });
        audio.addEventListener("pause", () => { if (playButton) playButton.textContent = "▶"; });

        audio.addEventListener("timeupdate", () => {
            const bar = document.getElementById("bar");
            const current = document.getElementById("cur");
            const duration = document.getElementById("dur");

            if (bar && audio.duration) {
                bar.style.width = ((audio.currentTime / audio.duration) * 100) + "%";
            }
            if (current) current.textContent = formatTime(audio.currentTime);
            if (duration) duration.textContent = formatTime(audio.duration);
        });

        audio.addEventListener("ended", playNextMusic);

        const searchInput = document.getElementById("search");
        if (searchInput) {
            searchInput.addEventListener("input", event => {
                const query = event.target.value.trim();
                clearTimeout(window.a51SearchTimer);

                window.a51SearchTimer = setTimeout(async () => {
                    if (!query) {
                        filteredTracks = tracks;
                        renderMusicList();
                        return;
                    }

                    const box = document.getElementById("musicList");
                    if (box) box.innerHTML = `<div class="loading">SEARCHING LIVE CATALOGUE...</div>`;

                    try {
                        filteredTracks = await jamendoRequest({
                            search: query,
                            limit: 50,
                            order: "popularity_total_desc",
                            audioformat: "mp32",
                            imagesize: 300
                        });
                        renderMusicList();
                    } catch (error) {
                        filteredTracks = tracks.filter(track => 
                            ((track.name || "") + " " + (track.artist_name || ""))
                            .toLowerCase().includes(query.toLowerCase())
                        );
                        renderMusicList();
                    }
                }, 400);
            });
        }

        async function downloadJamendoTrack(index) {
            const track = filteredTracks[index];
            if (!track || !track.audiodownload_allowed) {
                showToast("Downloads disabled by artist");
                return;
            }

            showToast("Preparing download...");
            const downloadURL = track.audiodownload || `https://api.jamendo.com/v3.0/tracks/file/?client_id=${encodeURIComponent(JAMENDO_CLIENT_ID)}&id=${encodeURIComponent(track.id)}&audioformat=mp32&action=download`;

            try {
                const response = await fetch(downloadURL);
                if (!response.ok) throw new Error("Download failed");
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = blobUrl;
                a.download = `${track.artist_name || 'Artist'} - ${track.name || 'Track'}.mp3`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                showToast("Download started ✓");
            } catch (e) {
                window.open(downloadURL, "_blank");
                showToast("Opening direct link");
            }
        }

        function formatTime(seconds) {
            seconds = Math.floor(Number(seconds) || 0);
            const minutes = Math.floor(seconds / 60);
            const remaining = seconds % 60;
            return minutes + ":" + String(remaining).padStart(2, "0");
        }

        function escapeHTML(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(window.a51ToastTimer);
            window.a51ToastTimer = setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        // Initialize application boot
        loadMusicCatalogue();
    </script>
</body>
</html>
